services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
      POSTGRES_DB: ${POSTGRES_DB:-isg_takip}
    volumes:
      - isg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isg_user} -d ${POSTGRES_DB:-isg_takip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-isg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-isg_takip}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunludur - en az 32 karakter rastgele deger kullanin}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://isg.shnai.cloud}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunludur - ilk kurulumdan sonra degistirin}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID zorunludur (Cloudflare R2 hesap id)}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID zorunludur}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY zorunludur}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-isg-takip-fotograflar}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  isg_postgres_data:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servis worker / manifest her zaman taze gelsin
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html her zaman taze gelsin: tarayici bunu eskiden cache'leyip (Cache-Control
    # baslığı olmadan varsayilan sezgisel cache suresiyle) yeni deploy sonrasi bile eski
    # JS/CSS bundle referanslarini iceren eski index.html'i servis edebiliyordu. Bu da
    # kullanicinin yeni ozellikleri (orn. admin "Projeyi Sifirla" alani gibi eklenen/degisen
    # UI parcalarini) gormemesine yol aciyordu. Hash'li /assets/* dosyalari zaten degismez
    # oldugu icin onlar uzun sureli cache'lenebilir.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend API'sini ayni origin uzerinden proxy'le (CORS'a gerek kalmaz,
    # backend disariya dogrudan acilmaz).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
